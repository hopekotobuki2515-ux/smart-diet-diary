name: Fix guide scroll position
on:
  push:
    paths:
      - '.github/workflows/fix-guide-scroll-position.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guide opening scroll
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="document.getElementById('openGuide').onclick=()=>{resetScrollTop();switchView('guideView')};document.getElementById('closeGuide').onclick=()=>{resetScrollTop();switchView('todayView')};"
          new="document.getElementById('openGuide').onclick=()=>{switchView('guideView');requestAnimationFrame(()=>{const g=document.getElementById('guideView');g.scrollIntoView({block:'start',behavior:'auto'});window.scrollBy(0,-document.querySelector('.hero').offsetHeight)})};document.getElementById('closeGuide').onclick=()=>{switchView('todayView');requestAnimationFrame(()=>document.getElementById('todayView').scrollIntoView({block:'start',behavior:'auto'}))};"
          if old not in s:
              raise SystemExit('target handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix guide opening position on Safari'
          git push
