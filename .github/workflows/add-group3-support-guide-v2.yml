name: Add group3 support and guide v2

on:
  push:
    paths:
      - '.github/workflows/add-group3-support-guide-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="openGuide"' not in s:
            s=s.replace('<header class="hero"><h1>SMART Diet ダイアリー</h1><p>写真と四群点数法で、食べ方のバランスに気づく</p></header>','<header class="hero"><div class="heroRow"><div><h1>SMART Diet ダイアリー</h1><p>写真と四群点数法で、食べ方のバランスに気づく</p></div><button type="button" class="guideBtn" id="openGuide">四群の見方</button></div></header>',1)
          if '.g3support{' not in s:
            s=s.replace('.hero h1{font-size:23px;margin:0 0 4px}.hero p{font-size:12px;margin:0;opacity:.95}', '.hero h1{font-size:23px;margin:0 0 4px}.hero p{font-size:12px;margin:0;opacity:.95}.heroRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.guideBtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}.g3support{padding:15px;margin-top:12px}.g3support h2{font-size:18px;margin:0 0 5px}.g3metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.g3metric{background:#f4fbf1;border:1px solid #dbead6;border-radius:13px;padding:10px}.g3metric small{display:block;color:#66745f;font-size:10px}.g3metric b{display:block;font-size:18px;margin-top:3px}.g3line{margin-top:10px;padding-top:10px;border-top:1px solid #e5ede1}.g3line strong{display:block;font-size:13px;margin-bottom:7px}.g3buttons{display:flex;gap:6px;flex-wrap:wrap}.g3buttons button{border:1px solid #cfe0c9;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:#476342}.g3reset{margin-top:10px;border:0;background:#f3eee9;color:#6b5544;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.guidecard{padding:16px;margin-bottom:12px}.guidecard h2{font-size:18px;margin:0 0 8px}.guidecard p,.guidecard li{font-size:13px;line-height:1.65}.guidegroups{display:grid;grid-template-columns:1fr 1fr;gap:9px}.guidegroup{border-radius:14px;padding:13px}.guidegroup h3{margin:0 0 5px;font-size:16px}.backGuide{width:100%;border:0;background:#f3eee9;color:#6b5544;border-radius:12px;padding:11px;font-weight:800}',1)
          if 'id="vegTotal"' not in s:
            s=s.replace('<section class="section" id="meals"></section>\n<section class="section"><div class="summary">','<section class="section" id="meals"></section>\n<section class="section"><div class="card g3support"><h2>3群サポート</h2><div class="hint">量が分かる時だけ、ざっくり記録でOKです。</div><div class="g3metrics"><div class="g3metric"><small>野菜合計</small><b id="vegTotal">0 / 350g</b></div><div class="g3metric"><small>緑黄色野菜</small><b id="greenVegTotal">0 / 120g以上</b></div><div class="g3metric"><small>淡色野菜</small><b id="lightVegTotal">0g</b></div><div class="g3metric"><small>きのこ・海藻</small><b id="mushSeaTotal">0 / 30〜40g</b></div></div><div class="g3line"><strong>緑黄色野菜</strong><div class="g3buttons"><button data-g3="green" data-g3step="-50">−50g</button><button data-g3="green" data-g3step="50">＋50g</button><button data-g3="green" data-g3step="100">＋100g</button></div></div><div class="g3line"><strong>淡色野菜</strong><div class="g3buttons"><button data-g3="light" data-g3step="-50">−50g</button><button data-g3="light" data-g3step="50">＋50g</button><button data-g3="light" data-g3step="100">＋100g</button></div></div><div class="g3line"><strong>きのこ・海藻</strong><div class="g3buttons"><button data-g3="mush" data-g3step="-10">−10g</button><button data-g3="mush" data-g3step="10">＋10g</button><button data-g3="mush" data-g3step="20">＋20g</button></div></div><div class="hint">野菜350gの内訳として、緑黄色野菜120g以上＋淡色野菜を意識。緑黄色野菜は、見分ける目安として切った断面まで色が濃いものが多いです。</div><button type="button" class="g3reset" id="resetG3">3群サポートをリセット</button><div class="advice" id="g3Advice" style="margin-top:10px"></div></div></section>\n<section class="section"><div class="summary">',1)
          if 'id="guideView"' not in s:
            s=s.replace('</main>\n</div>\n\n<nav class="footnav">','</main>\n<main id="guideView" class="view"><section class="section"><div class="card guidecard"><h2>四群点数法の見方</h2><p>1点＝80kcalを基本に、食品を4つの群に分けて食事のバランスを確認します。</p><div class="guidegroups"><div class="guidegroup g1"><h3>1群</h3><p>乳・乳製品・卵など</p></div><div class="guidegroup g2"><h3>2群</h3><p>魚・肉・豆・豆製品など</p></div><div class="guidegroup g3"><h3>3群</h3><p>野菜・きのこ・海藻・いも・果物など</p></div><div class="guidegroup g4"><h3>4群</h3><p>ご飯・パン・麺・油・砂糖・菓子・調味料など</p></div></div></div><div class="card guidecard"><h2>3群の目安</h2><ul><li>野菜は1日350gを目安に。</li><li>緑黄色野菜は120g以上を目安にし、残りを淡色野菜で補います。</li><li>きのこ・海藻類は30〜40g/日を目安として記録できます。</li><li>緑黄色野菜は、見分ける目安として切った断面まで色が濃いものが多いです。</li></ul><p class="hint">量が分からない外食や複合料理は、無理にグラム換算せず写真と群分けだけでもOKです。</p></div><button type="button" class="backGuide" id="closeGuide">今日に戻る</button></section></main>\n</div>\n\n<nav class="footnav">',1)
          s=s.replace("function blankDay(){return{...Object.fromEntries(mealDefs.map(([id])=>[id,blankMeal()])),weight:'',waist:'',memo:''}}","function blankDay(){return{...Object.fromEntries(mealDefs.map(([id])=>[id,blankMeal()])),weight:'',waist:'',memo:'',g3:{green:0,light:0,mush:0}}}",1)
          s=s.replace("base.weight=raw.weight??'';base.waist=raw.waist??'';base.memo=raw.memo??'';return base}","base.weight=raw.weight??'';base.waist=raw.waist??'';base.memo=raw.memo??'';base.g3={green:Math.max(0,Number(raw.g3?.green)||0),light:Math.max(0,Number(raw.g3?.light)||0),mush:Math.max(0,Number(raw.g3?.mush)||0)};return base}",1)
          if 'function renderG3Support' not in s:
            s=s.replace("function render(){document.getElementById('dateLabel').textContent=fmt(current);","function renderG3Support(d){const g=d.g3||{green:0,light:0,mush:0},veg=(Number(g.green)||0)+(Number(g.light)||0);document.getElementById('vegTotal').textContent=`${veg} / 350g`;document.getElementById('greenVegTotal').textContent=`${Number(g.green)||0} / 120g以上`;document.getElementById('lightVegTotal').textContent=`${Number(g.light)||0}g`;document.getElementById('mushSeaTotal').textContent=`${Number(g.mush)||0} / 30〜40g`;const box=document.getElementById('g3Advice');let parts=[];if(veg>=350)parts.push('○ 野菜350gを達成しています。');else parts.push(`野菜はあと約${350-veg}gが目安です。`);if((Number(g.green)||0)>=120)parts.push('緑黄色野菜120g以上を達成しています。');else parts.push('緑黄色野菜をもう少し足せると、よりバランスを意識できます。');if((Number(g.mush)||0)>=30)parts.push('きのこ・海藻類も意識できています。');else parts.push('きのこ・海藻類も少し加えられると良いですね。');box.textContent=parts.join(' ');box.className='advice '+(veg>=350&&(Number(g.green)||0)>=120?'alert-good':'');}\nfunction render(){document.getElementById('dateLabel').textContent=fmt(current);",1)
            s=s.replace("wrap.appendChild(el)});const s=renderBalance(document.getElementById('balance'),d);","wrap.appendChild(el)});renderG3Support(d);const s=renderBalance(document.getElementById('balance'),d);",1)
          if "data-g3step" in s and "document.addEventListener('click',e=>{const b=e.target.closest('[data-g3]')" not in s:
            s=s.replace('function persistDay(showAlert=false){',"document.addEventListener('click',e=>{const b=e.target.closest('[data-g3]');if(!b)return;const d=dayData(),k=b.dataset.g3,step=Number(b.dataset.g3step)||0;d.g3=d.g3||{green:0,light:0,mush:0};d.g3[k]=Math.max(0,(Number(d.g3[k])||0)+step);localStorage.setItem('sdd-'+keyDate(current),JSON.stringify(d));renderG3Support(d)});document.getElementById('resetG3').onclick=()=>{const d=dayData();d.g3={green:0,light:0,mush:0};localStorage.setItem('sdd-'+keyDate(current),JSON.stringify(d));renderG3Support(d)};\nfunction persistDay(showAlert=false){",1)
          s=s.replace("document.querySelectorAll('.footnav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));render();loadSettings();","document.getElementById('openGuide').onclick=()=>switchView('guideView');document.getElementById('closeGuide').onclick=()=>switchView('todayView');document.querySelectorAll('.footnav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));render();loadSettings();",1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add group3 support and four-group guide'
          git push
