name: Fix guide button touch
on:
  push:
    paths:
      - '.github/workflows/fix-guide-touch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guide button touch behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".guideBtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap}"
          new=".guideBtn{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;min-width:108px;min-height:44px;padding:9px 14px;font-size:12px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:25;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'min-height:44px' not in s and '.guideBtn{' in s:
              s=s.replace('.guideBtn{','.guideBtn{min-width:108px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:25;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;',1)

          oldjs="document.getElementById('openGuide').onclick=()=>{document.documentElement.style.setProperty('--guideTop',document.querySelector('.hero').offsetHeight+'px');switchView('guideView');const g=document.getElementById('guideView');g.scrollTop=0;requestAnimationFrame(()=>{g.scrollTop=0})};"
          newjs="function openGuideView(){document.documentElement.style.setProperty('--guideTop',document.querySelector('.hero').offsetHeight+'px');switchView('guideView');const g=document.getElementById('guideView');g.scrollTop=0;requestAnimationFrame(()=>{g.scrollTop=0})}const guideButton=document.getElementById('openGuide');guideButton.onclick=openGuideView;guideButton.addEventListener('touchend',e=>{e.preventDefault();openGuideView()},{passive:false});"
          if oldjs in s:
              s=s.replace(oldjs,newjs,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve guide button touch reliability"
          git push
