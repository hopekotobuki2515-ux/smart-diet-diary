name: Enlarge meal counter touch targets v2
on:
  push:
    paths:
      - '.github/workflows/enlarge-meal-counters-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch counter styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".groupcounter,.holdcounter{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px;min-width:0}.groupcounter button,.holdcounter button{flex:0 0 34px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:20px;font-weight:900;line-height:34px;box-shadow:0 1px 4px rgba(0,0,0,.08)}.groupcounter b,.holdcounter b{min-width:20px;text-align:center;font-size:15px}"
          new=".groupcounter,.holdcounter{position:relative;display:flex;align-items:center;justify-content:space-between;gap:0;margin-top:9px;min-width:0;width:100%}.groupcounter button,.holdcounter button{flex:0 0 40px;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.96);font-size:24px;font-weight:900;line-height:40px;box-shadow:0 2px 6px rgba(0,0,0,.10);touch-action:manipulation}.groupcounter b,.holdcounter b{position:absolute;left:50%;transform:translateX(-50%);min-width:18px;text-align:center;font-size:16px;pointer-events:none}.stepper button{width:44px;height:44px;border:0;border-radius:50%;font-size:24px;font-weight:900;touch-action:manipulation}"
          if old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('expected counter CSS not found')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make meal counters easier to tap"
          git push