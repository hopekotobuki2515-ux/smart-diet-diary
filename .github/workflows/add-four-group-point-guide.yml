name: Add four-group point guide

on:
  push:
    paths:
      - '.github/workflows/add-four-group-point-guide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = ".pointrow{display:flex;align-items:center;justify-content:space-between}.stepper{display:flex;align-items:center;gap:12px}"
          new_css = ".pointrow{display:flex;align-items:center;justify-content:space-between}.pointguide{margin-top:10px;border-top:1px solid #ece4dc;padding-top:9px}.pointguide summary{cursor:pointer;font-size:12px;font-weight:800;color:#7b4a24;list-style:none}.pointguide summary::-webkit-details-marker{display:none}.pointguide summary::after{content:' ▼';font-size:10px}.pointguide[open] summary::after{content:' ▲'}.guidebox{margin-top:8px;background:#fffaf6;border:1px solid #eadfd5;border-radius:12px;padding:10px 11px;font-size:12px;line-height:1.65;color:#5f5147}.guidecalc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.guidecalc span{background:#fff;border:1px solid #eadfd5;border-radius:9px;padding:6px 3px;text-align:center;font-weight:700}.stepper{display:flex;align-items:center;gap:12px}"
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)
          old_html = "<div class=\"point4 ${m.groups.includes(4)?'open':''}\"><div class=\"pointrow\"><div><strong>4群の点数</strong><div class=\"hint\">1点＝80kcal</div></div><div class=\"stepper\"><button data-step=\"-0.5\">−</button><span class=\"point\">${Number(m.p4).toFixed(1)}</span><button data-step=\"0.5\">＋</button></div></div></div>"
          new_html = "<div class=\"point4 ${m.groups.includes(4)?'open':''}\"><div class=\"pointrow\"><div><strong>4群の点数</strong><div class=\"hint\">1点＝80kcal</div></div><div class=\"stepper\"><button data-step=\"-0.5\">−</button><span class=\"point\">${Number(m.p4).toFixed(1)}</span><button data-step=\"0.5\">＋</button></div></div><details class=\"pointguide\"><summary>4群の1点目安を見る</summary><div class=\"guidebox\"><strong>まず見るのは「エネルギー（kcal）」</strong><br>市販品は栄養成分表示を確認し、<strong>80kcal＝1点</strong>として換算します。4群の食品が複数ある時は、それぞれの点数を足して入力します。<div class=\"guidecalc\"><span>40kcal<br>0.5点</span><span>80kcal<br>1点</span><span>120kcal<br>1.5点</span><span>160kcal<br>2点</span><span>200kcal<br>2.5点</span><span>240kcal<br>3点</span></div><div class=\"hint\">ご飯・パン・麺・油・砂糖など、食品別の目安量もここから確認できる形にしていきます。</div></div></details></div>"
          if old_html not in s:
              raise SystemExit('Point4 anchor not found')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add four-group point guide"
          git push
