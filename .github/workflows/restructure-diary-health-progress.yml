name: Restructure diary health progress
on:
  push:
    paths:
      - '.github/workflows/restructure-diary-health-progress.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wrapper UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="document.getElementById('closeGuide').onclick=()=>{guide.scrollTop=0;switchView('todayView')};\nrender();"
          if marker not in s:
              raise SystemExit('marker not found')
          code=r'''document.getElementById('closeGuide').onclick=()=>{guide.scrollTop=0;switchView('todayView')};

// --- 画面整理：ダイアリー / 体調 / 進捗 ---
const uiStyle=document.createElement('style');uiStyle.textContent=`
.footnav>div{grid-template-columns:repeat(5,1fr)!important}.footnav button{font-size:10px!important;padding-left:1px!important;padding-right:1px!important}
.healthHero{padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#fff5e9,#fff);border:1px solid var(--line);border-radius:18px}.healthHero h2{font-size:19px;margin:0 0 7px}.healthHero p{font-size:13px;line-height:1.7;margin:0;color:#65574c}
.progressMeasureTitle{font-size:19px;margin:0 0 4px}.progressMeasureSub{font-size:12px;color:var(--muted);margin:0 0 10px}
`;
document.head.appendChild(uiStyle);

const today=document.getElementById('todayView');
const progress=document.getElementById('progressView');
const measureSec=document.querySelector('.measure')?.closest('.section');
const healthSec=document.querySelector('.healthcheck')?.closest('.section');

let healthView=document.getElementById('healthView');
if(!healthView){
  healthView=document.createElement('main');healthView.id='healthView';healthView.className='view';
  healthView.innerHTML=`<section class="section"><div class="healthHero"><h2>おはようございます！！</h2><p>今日の体調はいかがですか？<br>今日も楽しく健康生活を目指しましょう！！</p></div></section>`;
  document.querySelector('.app').appendChild(healthView);
}
if(healthSec)healthView.appendChild(healthSec);

if(measureSec){
  const card=measureSec.querySelector('.measure');
  if(card){card.querySelector('h2').textContent='体重・腹囲の記録';}
  progress.querySelector('.section')?.prepend(measureSec);
}

const nav=document.querySelector('.footnav>div');
if(nav){
  nav.innerHTML=`<button data-view="todayView" class="active">ダイアリー</button><button data-view="healthView">体調</button><button data-view="calendarView">カレンダー</button><button data-view="progressView">進捗</button><button data-view="settingsView">設定</button>`;
}

const originalSwitchView=switchView;
switchView=function(id){
  originalSwitchView(id);
  if(id==='healthView'){
    renderHealth(dayData());
    resetScrollTop();
  }
};
document.querySelectorAll('.footnav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
render();'''
          s=s.replace(marker,code,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Separate diary health and progress views"
          git push
# trigger
