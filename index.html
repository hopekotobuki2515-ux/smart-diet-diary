<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47a2a">
<title>SMART Diet ダイアリー</title>
<style>
:root{--orange:#f47a2a;--orange2:#ff9a4b;--ink:#2c2c2c;--muted:#777;--bg:#fffaf5;--card:#fff;--line:#eee2d7;--g1:#d9ecff;--g2:#ffe0e0;--g3:#dff3dc;--g4:#fff0c8;--good:#2f8f4e;--warn:#d98b00;--danger:#cf3d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}.hero{position:sticky;top:0;z-index:20;padding:22px 18px 18px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;box-shadow:0 3px 12px rgba(70,45,20,.12)}.hero h1{font-size:24px;margin:0 0 5px}.hero p{font-size:13px;margin:0;opacity:.95}.section{padding:14px 14px 0}.datebar,.card,.summary{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 14px rgba(70,45,20,.05)}.datebar{padding:13px 15px;display:flex;align-items:center;justify-content:space-between}.datebar button,.ghost{border:0;background:#fff4e8;border-radius:10px;padding:8px 11px;color:#7b4a24;font-weight:700}.meal{padding:14px;margin-top:12px}.mealhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mealhead h2{font-size:17px;margin:0}.photo{display:block;width:100%;border:2px dashed #e5d6c8;background:#fffaf6;border-radius:15px;padding:18px;text-align:center;color:#8b6f59;font-weight:700;cursor:pointer}.preview{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-bottom:10px;display:none}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grp{border:2px solid transparent;border-radius:14px;padding:11px 4px;text-align:center;font-weight:800;cursor:pointer;user-select:none}.grp small{display:block;font-size:11px;font-weight:600;margin-top:3px}.g1{background:var(--g1)}.g2{background:var(--g2)}.g3{background:var(--g3)}.g4{background:var(--g4)}.grp.on{border-color:#333;transform:translateY(-1px)}.sub3,.point4{display:none;margin-top:10px;padding:11px;background:#fbfbfb;border-radius:13px}.sub3.open,.point4.open{display:block}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d9d9d9;background:white;border-radius:999px;padding:8px 10px;font-size:12px}.chip.on{background:#e7f4e4;border-color:#83b47a;font-weight:700}.pointrow{display:flex;align-items:center;justify-content:space-between}.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:34px;height:34px;border:0;border-radius:50%;font-size:20px}.point{font-size:20px;font-weight:800}.hint{font-size:11px;color:var(--muted);margin-top:7px}.summary{padding:16px;margin-top:14px}.summary h2{font-size:18px;margin:0 0 12px}.balance{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score{border-radius:14px;padding:12px 4px;text-align:center;font-weight:800}.score b{display:block;font-size:22px;margin-top:3px}.advice{margin-top:12px;padding:12px 13px;border-radius:13px;background:#f8f8f8;font-size:14px;line-height:1.6}.alert-good{background:#edf8ef;color:#246f39}.alert-warn{background:#fff6dc;color:#8a6500}.alert-danger{background:#fff0f0;color:#a72929}.settings{margin-top:12px;padding:13px 15px}.settings label{font-size:13px;font-weight:700}.sex{display:flex;gap:8px;margin-top:8px}.sex button{flex:1;border:1px solid #ddd;background:white;padding:10px;border-radius:12px;font-weight:700}.sex button.on{border-color:var(--orange);background:#fff0e5;color:#a94c0a}.footnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #eee;display:flex;justify-content:center;z-index:9}.footnav>div{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.footnav button{border:0;background:transparent;padding:10px 4px 12px;font-size:11px;color:#666}.footnav button.active{color:var(--orange);font-weight:800}.savebar{display:flex;gap:8px;margin-top:12px}.savebar button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:800}.primary{background:var(--orange);color:white}.secondary{background:#f3eee9;color:#6b5544}.tiny{font-size:11px;color:#8a7b70;text-align:center;margin:12px 6px 0}
</style>
</head>
<body>
<div class="app">
<header class="hero"><h1>SMART Diet ダイアリー</h1><p>写真と四群点数法で、食べ方のバランスに気づく</p></header>
<section class="section"><div class="datebar"><button id="prevDay">‹</button><strong id="dateLabel"></strong><button id="nextDay">›</button></div></section>
<section class="section" id="meals"></section>
<section class="section"><div class="summary"><h2>今日のまとめ</h2><div class="balance" id="balance"></div><div class="advice" id="advice"></div></div>
<div class="card settings"><label>1日の目安点数</label><div class="sex"><button data-sex="female">女性 15点</button><button data-sex="male">男性 21点</button></div><div class="hint">第1〜3群は各3点を基本に、第4群で残りを調整します。第4群の目安は女性6点・男性12点です。</div></div>
<div class="savebar"><button class="secondary" id="clearDay">今日をリセット</button><button class="primary" id="saveDay">保存する</button></div><p class="tiny">試作版：データはこの端末内に保存されます。Firebase連携は次の段階で追加します。</p></section>
</div>
<nav class="footnav"><div><button class="active">今日</button><button>カレンダー</button><button>振り返り</button><button>設定</button></div></nav>
<script>
const mealDefs=[['breakfast','朝食'],['lunch','昼食'],['dinner','夕食'],['snack','間食']];
let current=new Date(); current.setHours(0,0,0,0);
const state={sex:localStorage.getItem('sdd-sex')||'female',days:{}};
const keyDate=d=>d.toISOString().slice(0,10);
function blankMeal(){return{groups:[],sub3:[],p4:0,img:null}}
function dayData(){const k=keyDate(current); if(!state.days[k]){const saved=localStorage.getItem('sdd-'+k);state.days[k]=saved?JSON.parse(saved):Object.fromEntries(mealDefs.map(([id])=>[id,blankMeal()]));}return state.days[k]}
function fmt(d){return new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(d)}
function compress(file,cb){const img=new Image(),r=new FileReader();r.onload=e=>img.src=e.target.result;img.onload=()=>{const max=1280,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.76))};r.readAsDataURL(file)}
function render(){document.getElementById('dateLabel').textContent=fmt(current);const d=dayData(),wrap=document.getElementById('meals');wrap.innerHTML='';mealDefs.forEach(([id,label])=>{const m=d[id];const el=document.createElement('div');el.className='card meal';el.innerHTML=`<div class="mealhead"><h2>${label}</h2></div><img class="preview" ${m.img?`src="${m.img}" style="display:block"`:''}><label class="photo">📷 ${m.img?'写真を変更':'写真を追加'}<input type="file" accept="image/*" capture="environment" hidden></label><div class="groups">${[1,2,3,4].map(g=>`<div class="grp g${g} ${m.groups.includes(g)?'on':''}" data-g="${g}">${g}群<small>${['','乳・卵','魚・肉・豆','野菜など','主食・油など'][g]}</small></div>`).join('')}</div><div class="sub3 ${m.groups.includes(3)?'open':''}"><div class="hint" style="margin:0 0 8px">3群の中身（複数選択可）</div><div class="chips">${['緑黄色野菜','淡色野菜','きのこ・海藻','いも','果物'].map(x=>`<button class="chip ${m.sub3.includes(x)?'on':''}" data-sub="${x}">${x}</button>`).join('')}</div></div><div class="point4 ${m.groups.includes(4)?'open':''}"><div class="pointrow"><div><strong>4群の点数</strong><div class="hint">1点＝80kcal</div></div><div class="stepper"><button data-step="-0.5">−</button><span class="point">${m.p4.toFixed(1)}</span><button data-step="0.5">＋</button></div></div></div>`;
const input=el.querySelector('input');input.onchange=e=>{const f=e.target.files[0];if(f)compress(f,x=>{m.img=x;render()})};el.querySelectorAll('.grp').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;m.groups=m.groups.includes(g)?m.groups.filter(x=>x!==g):[...m.groups,g];if(g===4&&!m.groups.includes(4))m.p4=0;render()});el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const x=b.dataset.sub;m.sub3=m.sub3.includes(x)?m.sub3.filter(v=>v!==x):[...m.sub3,x];render()});el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{m.p4=Math.max(0,Math.round((m.p4+(+b.dataset.step))*2)/2);render()});wrap.appendChild(el)});renderSummary();document.querySelectorAll('.sex button').forEach(b=>b.classList.toggle('on',b.dataset.sex===state.sex))}
function renderSummary(){const d=dayData(),counts=[1,2,3,4].map(g=>mealDefs.reduce((n,[id])=>n+(d[id].groups.includes(g)?1:0),0));const total4=mealDefs.reduce((n,[id])=>n+d[id].p4,0),target4=state.sex==='female'?6:12;document.getElementById('balance').innerHTML=counts.map((n,i)=>`<div class="score g${i+1}">${i+1}群<b>${i===3?total4.toFixed(1):n}</b><small>${i===3?'点':'食'}</small></div>`).join('');const sub3=mealDefs.flatMap(([id])=>d[id].sub3),unique3=[...new Set(sub3)];let txt='',cls='';if(total4>target4){txt=`⚠️ 4群が目安を ${ (total4-target4).toFixed(1) }点上回っています。次の食事では主食・油・甘いものの重なりを少し調整してみましょう。`;cls='alert-danger'}else if(total4>=target4*.8){txt=`△ 4群は目安に近づいています。あと ${Math.max(0,target4-total4).toFixed(1)}点が目安です。`;cls='alert-warn'}else{txt=`○ 4群は今のところ目安以内です。`;cls='alert-good'}if(unique3.length<2)txt+=' 3群は種類をもう1つ増やせると、よりバランスを意識できます。';else txt+=' 3群も複数の種類を意識できています。';const a=document.getElementById('advice');a.textContent=txt;a.className='advice '+cls}
function save(){const k=keyDate(current);localStorage.setItem('sdd-'+k,JSON.stringify(dayData()));alert('保存しました')}
document.getElementById('saveDay').onclick=save;document.getElementById('clearDay').onclick=()=>{if(confirm('今日の記録をリセットしますか？')){state.days[keyDate(current)]=Object.fromEntries(mealDefs.map(([id])=>[id,blankMeal()]));localStorage.removeItem('sdd-'+keyDate(current));render()}};document.getElementById('prevDay').onclick=()=>{current.setDate(current.getDate()-1);render()};document.getElementById('nextDay').onclick=()=>{current.setDate(current.getDate()+1);render()};document.querySelectorAll('.sex button').forEach(b=>b.onclick=()=>{state.sex=b.dataset.sex;localStorage.setItem('sdd-sex',state.sex);render()});render();
</script>
</body>
</html>
