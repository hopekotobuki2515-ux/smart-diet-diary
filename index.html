<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47a2a">
<title>SMART Diet ダイアリー</title>
<style>html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#fffaf5}#appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fffaf5}</style>
</head>
<body>
<iframe id="appFrame" src="legacy.html?v=20260828j"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;

    const viewportLockStyle=doc.createElement('style');
    viewportLockStyle.textContent=`
      html,body{
        width:100%;
        height:100%;
        height:100dvh;
        margin:0;
        overflow:hidden;
        overscroll-behavior:none;
        touch-action:manipulation;
      }
      .app{
        height:100%;
        height:100dvh;
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
        overscroll-behavior-y:none;
        -webkit-overflow-scrolling:touch;
        touch-action:pan-y;
      }
    `;
    doc.head.appendChild(viewportLockStyle);

    const landingLead=doc.querySelector('.landingHero p');
    if(landingLead){
      landingLead.innerHTML='毎日の食事を写真で残し、四群点数法を使って食事の<br>バランスに気づくためのダイアリーです。';
    }

    const guideStyle=doc.createElement('link');
    guideStyle.rel='stylesheet';
    guideStyle.href='guide-wheel-fix.css?v=20260826d';
    doc.head.appendChild(guideStyle);

    const shell=doc.createElement('script');
    shell.src='app-shell.js?v=20260828j';
    shell.onload=()=>{
      const greeting=doc.createElement('script');
      greeting.src='morning-greeting.js?v=20260826a';
      doc.body.appendChild(greeting);

      const enter=doc.createElement('script');
      enter.src='enter-hotfix.js?v=20260826u';
      doc.body.appendChild(enter);

      const fix=doc.createElement('script');
      fix.src='ui-hotfix.js?v=20260828j';
      fix.onload=()=>{
        const photo=doc.createElement('script');
        photo.src='photo-hotfix.js?v=20260826u';
        photo.onload=()=>{
          const fit=doc.createElement('script');
          fit.src='fit-hotfix.js?v=20260826y';
          fit.onload=()=>{
            const bottomNav=doc.createElement('script');
            bottomNav.src='bottom-nav-hotfix.js?v=20260828j';
            bottomNav.onload=()=>{
              const recovery=doc.createElement('script');
              recovery.src='recovery-hotfix.js?v=20260828j';
              recovery.onload=()=>{
                const search=doc.createElement('script');
                search.src='food-search-view.js?v=20260828j';
                search.onload=()=>{
                  const searchNav=doc.createElement('script');
                  searchNav.src='search-nav-hotfix.js?v=20260828j';
                  searchNav.onload=()=>{
                    const performance=doc.createElement('script');
                    performance.src='performance-hotfix.js?v=20260828j';
                    performance.onload=()=>{
                      const diaryLink=doc.createElement('script');
                      diaryLink.src='food-search-diary-link.js?v=20260828j';
                      doc.body.appendChild(diaryLink);
                    };
                    doc.body.appendChild(performance);
                  };
                  doc.body.appendChild(searchNav);
                };
                doc.body.appendChild(search);
              };
              doc.body.appendChild(recovery);
            };
            doc.body.appendChild(bottomNav);
          };
          doc.body.appendChild(fit);
        };
        doc.body.appendChild(photo);
      };
      doc.body.appendChild(fix);
    };
    doc.body.appendChild(shell);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
