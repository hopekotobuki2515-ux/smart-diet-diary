<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf5}#appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fffaf5}</style>
</head>
<body>
<iframe id="appFrame" src="legacy.html?v=20260823o"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const shell=doc.createElement('script');
    shell.src='app-shell.js?v=20260823o';
    shell.onload=()=>{
      const fix=doc.createElement('script');
      fix.src='ui-hotfix.js?v=20260823o';
      fix.onload=()=>{
        const photo=doc.createElement('script');
        photo.src='photo-hotfix.js?v=20260823o';
        doc.body.appendChild(photo);
      };
      doc.body.appendChild(fix);
    };
    doc.body.appendChild(shell);
  }catch(e){console.error(e)}
});
</script>
</body>
